name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ArchivesSpace 4.x runs on JRuby 9.4, which is MRI 3.1 compatible.
        # Testing the floor and a current release keeps the shared library
        # honest about which syntax it may use.
        ruby: ['3.1', '3.2']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the specs
        run: bundle exec rspec

      - name: Check that every Ruby file parses
        run: |
          find backend frontend lib schemas -name '*.rb' -print0 \
            | xargs -0 -n1 ruby -c > /dev/null

      - name: Check that the locale files are valid YAML
        run: |
          ruby -ryaml -e '
            Dir.glob("frontend/locales/*.yml").each do |path|
              YAML.load_file(path)
              puts "#{path} OK"
            end
          '
